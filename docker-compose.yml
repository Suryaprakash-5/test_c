version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tnpsc_ace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tnpsc_ace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tnpsc_ace_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/tnpsc_ace?schema=public
      - JWT_SECRET=tnpsc_ace_production_secure_secret_key_change_me
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - ADMIN_INITIAL_NAME=TNPSC ACE System Admin
      - ADMIN_INITIAL_EMAIL=admin@tnpscace.edu
      - ADMIN_INITIAL_PASSWORD=AdminAce@2026!
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
